# ============================================================
# Cloudflare Tunnel Configuration — Production
# Galaxy TV V4K — galaxytv4k.online
# ============================================================
# All services run on Docker + Cloudflare Tunnel (no Vercel).
#
# DNS Architecture:
#   www.galaxytv4k.online     → Cloudflare Tunnel → Docker frontend (3000)
#   admin.galaxytv4k.online   → Cloudflare Tunnel → Docker admin (3001)
#   api.galaxytv4k.online     → Cloudflare Tunnel → Docker backend (4000)
#   media.galaxytv4k.online   → Cloudflare R2 (image storage)
#
# IMPORTANT: Use 127.0.0.1 instead of localhost.
# On Windows, localhost resolves to IPv6 (::1) first, which
# causes "database down" errors because Docker binds to IPv4.
#
# Setup:
#   1. Install cloudflared
#   2. Login: cloudflared tunnel login
#   3. Create tunnel: cloudflared tunnel create galaxytv
#   4. Copy this config to ~/.cloudflared/config.yml
#   5. Route DNS: cloudflared tunnel route dns galaxytv www.galaxytv4k.online
#   6. Route DNS: cloudflared tunnel route dns galaxytv api.galaxytv4k.online
#   7. Route DNS: cloudflared tunnel route dns galaxytv admin.galaxytv4k.online
#   8. Run: cloudflared tunnel run galaxytv
# ============================================================

tunnel: galaxytv
credentials-file: ~/.cloudflared/fdb3778b-85e8-403e-aab2-c15fa61d6d0f.json

ingress:
  # API endpoint → backend (port 4000)
  - hostname: api.galaxytv4k.online
    service: http://127.0.0.1:4000

  # Admin dashboard → nginx proxy (port 3001)
  - hostname: admin.galaxytv4k.online
    service: http://127.0.0.1:3001

  # Public website → nginx proxy (port 3000)
  - hostname: www.galaxytv4k.online
    service: http://127.0.0.1:3000

  # Root domain redirect to www
  - hostname: galaxytv4k.online
    service: http://127.0.0.1:3000

  # Catch-all — must be last
  - service: http_status:404
