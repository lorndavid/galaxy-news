# ============================================================
# Cloudflare Tunnel Configuration
# Galaxy TV V4K — galaxytv4k.online
# ============================================================
# This config routes your domain traffic to local Docker services.
#
# Setup:
#   1. Install cloudflared: https://developers.cloudflare.com/cloudflare-one/connections/connect-networks/downloads/
#   2. Login: cloudflared tunnel login
#   3. Create tunnel: cloudflared tunnel create galaxytv
#   4. Copy this config to ~/.cloudflared/config.yml
#   5. Route DNS: cloudflared tunnel route dns galaxytv www.galaxytv4k.online
#   6. Route DNS: cloudflared tunnel route dns galaxytv api.galaxytv4k.online
#   7. Route DNS: cloudflared tunnel route dns galaxytv admin.galaxytv4k.online
#   8. Run: cloudflared tunnel run galaxytv
# ============================================================

tunnel: galaxytv
credentials-file: ~/.cloudflared/galaxytv.json

ingress:
  # API endpoint → backend (port 4000)
  - hostname: api.galaxytv4k.online
    service: http://localhost:4000

  # Admin dashboard → nginx proxy (port 3001)
  - hostname: admin.galaxytv4k.online
    service: http://localhost:3001

  # Public website → nginx proxy (port 3000)
  - hostname: www.galaxytv4k.online
    service: http://localhost:3000

  # Root domain redirect to www
  - hostname: galaxytv4k.online
    service: http://localhost:3000

  # Catch-all — must be last
  - service: http_status:404
