<html lang="km">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:opsz,wght@17..18,400..700&family=Huninn&family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Khmer:wght@100;300;400;500;600;700;800;900&family=Noto+Sans+SC:wght@100;300;400;500;600;700;900&family=Suwannaphum:wght@100;300;400;700;900&family=Poppins:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700;900&family=Lato:wght@300;400;700;900&family=Merriweather:wght@300;400;700;900&family=Playfair+Display:wght@400;500;600;700;800;900&family=Noto+Serif+Khmer:wght@300;400;500;600;700;900&family=Noto+Serif+SC:wght@200;300;400;500;600;700;900&family=Kantumruy+Pro:wght@300;400;500;600;700&family=Source+Sans+3:wght@300;400;500;600;700;800&family=Battambang:wght@300;400;700;900&family=Bayon&family=Koulen&family=Dangrek&display=swap"
      rel="stylesheet"
    />
    <title>Galaxy TV V4K — Admin</title>
    <script>
      // Apply the persisted theme + admin language before hydration to avoid
      // a flash of the wrong theme ("light" is the default).
      (function () {
        try {
          var prefs = JSON.parse(localStorage.getItem("navatra_admin_prefs") || "{}");
          var theme = prefs.theme || "light";
          var dark =
            theme === "dark" ||
            (theme === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          document.documentElement.lang = prefs.adminLang || "km";
        } catch (e) {
          /* corrupted prefs — keep defaults */
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
