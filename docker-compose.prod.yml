# ============================================================
# Galaxy TV V4K — Production Docker Compose (VPS only)
# ============================================================
# Frontend + Admin are deployed to Vercel.
# This file runs only the backend infrastructure on the VPS:
#   - backend (Express API)
#   - postgres (PostgreSQL 17)
#   - redis (Redis 7)
#   - backup (automated daily PostgreSQL backups)
#   - cloudflared (Cloudflare Tunnel for API routing)
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# For local development with frontend+admin, use:
#   docker compose up -d --build
# ============================================================

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-galaxy_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-galaxy_tv}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-24h}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-1}
      REDIS_URL: redis://redis:6379
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-news-media}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-https://media.galaxytv4k.online}
      # Production origins (Vercel deployments)
      FRONTEND_URL: ${FRONTEND_URL:-https://www.galaxytv4k.online}
      ADMIN_URL: ${ADMIN_URL:-https://admin.galaxytv4k.online}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://www.galaxytv4k.online}
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:-https://admin.galaxytv4k.online}
      TELEGRAM_API_BASE: ${TELEGRAM_API_BASE:-https://api.telegram.org}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://www.galaxytv4k.online}
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:17-alpine
    container_name: galaxy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-galaxy_tv}
      POSTGRES_USER: ${POSTGRES_USER:-galaxy_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # NOT exposed to public — only accessible within Docker network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-galaxy_admin} -d ${POSTGRES_DB:-galaxy_tv}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: galaxy-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    # NOT exposed to public — only accessible within Docker network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backup:
    image: postgres:17-alpine
    container_name: galaxy-backup
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-galaxy_tv}
      POSTGRES_USER: ${POSTGRES_USER:-galaxy_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGHOST: postgres
      PGPORT: "5432"
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - backup_data:/backups
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "═══ Galaxy TV V4K Backup Service ═══"
        echo "Scheduled: daily at 02:00 UTC"
        echo "Backups kept: 30 days"
        echo ""
        /usr/local/bin/backup.sh
        echo ""
        echo "Waiting for next scheduled backup..."
        echo "0 2 * * * /usr/local/bin/backup.sh >> /var/log/backup.log 2>&1" > /etc/crontabs/root
        crond -f -l 2
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: galaxy-tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    # No ports exposed — Cloudflare Tunnel makes outbound connections only

volumes:
  postgres_data:
  uploads_data:
  redis_data:
  backup_data:
