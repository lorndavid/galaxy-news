# ============================================================
# Galaxy TV V4K — News Platform (Docker Compose)
#
# Services:
#   backend  — Express + Prisma API (PostgreSQL)
#   frontend — Public Vue 3 website (nginx)
#   admin    — Editorial CMS (nginx)
#   postgres — PostgreSQL 17 database
#   redis    — API cache (persistent volume)
#
# Images are stored in Cloudflare R2 (S3-compatible).
# ============================================================

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-galaxy_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-galaxy_tv}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-24h}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-1}
      REDIS_URL: redis://redis:6379
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-news-media}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-https://media.galaxytv4k.online}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ADMIN_URL: ${ADMIN_URL:-http://localhost:3001}
      TELEGRAM_API_BASE: ${TELEGRAM_API_BASE:-https://api.telegram.org}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://www.galaxytv4k.online}
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:17-alpine
    container_name: galaxy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-galaxy_tv}
      POSTGRES_USER: ${POSTGRES_USER:-galaxy_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-galaxy_admin} -d ${POSTGRES_DB:-galaxy_tv}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: galaxy-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: /api/v1
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:80"

  admin:
    build:
      context: ./admin
      args:
        VITE_API_BASE: /api/v1
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3001:80"

  # ── Automated PostgreSQL backup (daily at 2:00 AM UTC) ──
  backup:
    image: postgres:17-alpine
    container_name: galaxy-backup
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-galaxy_tv}
      POSTGRES_USER: ${POSTGRES_USER:-galaxy_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGHOST: postgres
      PGPORT: "5432"
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - backup_data:/backups
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "═══ Galaxy TV V4K Backup Service ═══"
        echo "Scheduled: daily at 02:00 UTC"
        echo "Backups kept: 30 days"
        echo ""
        # Run backup now on first start
        /usr/local/bin/backup.sh
        echo ""
        echo "Waiting for next scheduled backup..."
        # Create a crontab and run crond
        echo "0 2 * * * /usr/local/bin/backup.sh >> /var/log/backup.log 2>&1" > /etc/crontabs/root
        crond -f -l 2
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
  redis_data:
  backup_data:
