# ============================================================
# Navatra 4K TV — News Platform (Docker Compose)
#
# Services:
#   backend  — Express + Prisma API (SQLite on a persistent volume)
#   frontend — Public Vue 3 website (nginx)
#   admin    — Editorial CMS (nginx)
#   redis    — API cache (persistent volume)
#   minio    — Object storage for media (persistent volume + console)
#
# SQLite is a file database: it lives in a named volume mounted at
# /app/prisma so the database survives container restarts. It is NOT
# treated as a network service.
# ============================================================

services:
  backend:
    # Repo-root context: the Dockerfile copies backend/ + assets/ so the
    # seed's demo images are available for seeded articles.
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: "file:/app/data/dev.db"
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-7}
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-navatra}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-navatra_dev_secret}
      MINIO_BUCKET: news-media
      MINIO_PUBLIC_URL: /minio
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ADMIN_URL: ${ADMIN_URL:-http://localhost:3001}
      # Telegram — the bot token itself is stored through the protected
      # admin settings, NOT here. TELEGRAM_API_BASE lets the E2E suite
      # point the backend at the in-stack mock Telegram API.
      TELEGRAM_API_BASE: ${TELEGRAM_API_BASE:-https://api.telegram.org}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:3000}
    volumes:
      # The DB lives in its own dir — never mount the whole /app/prisma
      # (schema/migrations/seed must always come from the image, otherwise
      # a stale seed.ts shadowed by the volume re-seeds old data on boot).
      - sqlite_data:/app/data
      - uploads_data:/app/uploads
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-navatra}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-navatra_dev_secret}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Mock Telegram Bot API — used only by the E2E suite when the backend is
  # started with TELEGRAM_API_BASE=http://mock-telegram:8448. It is always
  # built so the switch is a single env var, but normal runs never call it.
  mock-telegram:
    build:
      context: ./e2e/mock-telegram
    restart: unless-stopped
    ports:
      - "8448:8448"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: /api/v1
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

  admin:
    build:
      context: ./admin
      args:
        VITE_API_BASE: /api/v1
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3001:80"

volumes:
  sqlite_data:
  uploads_data:
  redis_data:
  minio_data:
